name: Phantom Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Generate two premium snake themes
      - name: Generate Phantom Snake Themes
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |

            # 🟢 Emerald Noir
            dist/emerald-noir.gif?color_snake=#00E5A0&color_dots=#06120F,#0B3026,#0F6049,#13A879,#00E5A0&color_background=#050807

            # 🌹 Arctic Rose
            dist/arctic-rose.gif?color_snake=#FF6B9D&color_dots=#10070D,#351321,#66233D,#B83D68,#FF6B9D&color_background=#07090D

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Fix permissions
      - name: Fix Generated Files Permissions
        run: sudo chown -R "$(id -u):$(id -g)" dist

      # 4. Select today's theme
      - name: Select Daily Snake Theme
        shell: bash
        run: |

          DAY_OF_YEAR=$(date -u +%j)
          THEME_INDEX=$((10#$DAY_OF_YEAR % 2))

          if [ "$THEME_INDEX" -eq 0 ]; then
            cp dist/emerald-noir.gif dist/current.gif
            echo "Today's theme: Emerald Noir"
          else
            cp dist/arctic-rose.gif dist/current.gif
            echo "Today's theme: Arctic Rose"
          fi

      # 5. Deploy to output branch
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"
